<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <clipPath id="ck-badge-clip">
      <circle cx="26" cy="32" r="25"/>
    </clipPath>
    <linearGradient id="ck-bg" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#DDF78E"/>
      <stop offset="55%" stop-color="#A6DF4C"/>
      <stop offset="100%" stop-color="#7BC427"/>
    </linearGradient>
    <linearGradient id="ck-head" x1="0.2" y1="0.08" x2="0.82" y2="0.95">
      <stop offset="0%" stop-color="#A67243"/>
      <stop offset="52%" stop-color="#7D4F28"/>
      <stop offset="100%" stop-color="#583519"/>
    </linearGradient>
    <linearGradient id="ck-beak" x1="0" y1="0" x2="1" y2="0.45">
      <stop offset="0%" stop-color="#FCF3D8"/>
      <stop offset="58%" stop-color="#EBD098"/>
      <stop offset="100%" stop-color="#D4AE6A"/>
    </linearGradient>
  </defs>

  <!-- 1. Bright lime-green circular medallion -->
  <circle cx="26" cy="32" r="25" fill="url(#ck-bg)"/>
  <g clip-path="url(#ck-badge-clip)">
    <circle cx="38" cy="22" r="16" fill="#F6FCD7" opacity="0.52"/>
  </g>

  <!-- 2. Medallion ring (drawn under the beak so the beak breaks cleanly out of the circle) -->
  <circle cx="26" cy="32" r="25" fill="none" stroke="#6BB520" stroke-width="1.5" opacity="0.65"/>

  <!-- 3. Unclipped long, slender curved kiwi beak poking right out past the circle edge -->
  <path
    d="M31.0 29.8
       C43.0 31.2, 53.8 35.0, 62.4 41.2
       C63.0 41.6, 62.6 42.6, 61.8 42.5
       C52.0 39.2, 41.8 36.8, 30.2 36.4 Z"
    fill="url(#ck-beak)"
  />
  <path
    d="M31.0 33.4
       C42.6 34.7, 52.8 37.8, 62.0 42.0
       C52.0 39.2, 41.8 36.8, 30.2 36.4 Z"
    fill="#B88B46"
    opacity="0.42"
  />
  <path
    d="M31.0 29.8 C43.0 31.2, 53.8 35.0, 62.4 41.2 C63.0 41.6, 62.6 42.6, 61.8 42.5 C52.0 39.2, 41.8 36.8, 30.2 36.4"
    fill="none"
    stroke="#966C32"
    stroke-width="0.9"
    stroke-linejoin="round"
    opacity="0.58"
  />
  <!-- Classic kiwi nostril near the tip of the beak -->
  <circle cx="58.2" cy="39.4" r="0.85" fill="#8C6229" opacity="0.85"/>

  <!-- 4. Big, plump brown kiwi head & neck (clipped cleanly to the circle, overlapping beak base) -->
  <g clip-path="url(#ck-badge-clip)">
    <path
      d="M-2 59
         C0 44, 4.2 33.2, 9.4 25.8
         C11.9 22.3, 15.1 19.6, 19.0 18.4
         C18.2 16.7, 19.3 15.5, 21.3 16.5
         C22.9 17.3, 23.8 17.9, 24.9 18.2
         C31.5 18.9, 36.2 23.8, 36.4 30.4
         C36.6 37.3, 32.5 42.8, 26.4 45.8
         C28.2 50.2, 29.8 54.6, 30.8 59 Z"
      fill="url(#ck-head)"
    />

    <!-- Soft warm tan crown highlight -->
    <path
      d="M13.2 24.9 C17.0 20.5, 24.6 19.6, 30.2 22.8 C26.4 22.0, 20.2 23.1, 15.6 27.6 C14.1 29.0, 12.1 26.4, 13.2 24.9 Z"
      fill="#C99664"
      opacity="0.52"
    />

    <!-- Subtle neck shadow under chin -->
    <path
      d="M15.4 44.6 C21.0 46.6, 26.8 45.7, 30.8 42.2 C28.2 46.4, 23.6 48.8, 18.0 48.2 C16.2 48.0, 14.7 46.2, 15.4 44.6 Z"
      fill="#3F2410"
      opacity="0.36"
    />

    <!-- Soft warm cheek patch -->
    <ellipse cx="25.2" cy="35.0" rx="3.7" ry="2.3" fill="#BF8A58" opacity="0.48"/>

    <!-- Glossy dark eye with crisp catchlights (no smile) -->
    <circle cx="27.2" cy="28.6" r="3.9" fill="#1A1109"/>
    <circle cx="28.6" cy="27.2" r="1.4" fill="#FFFFFF"/>
    <circle cx="26.0" cy="30.0" r="0.6" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
